name: MIGL Sovereign Suite CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Hexagonal Daemon Syntax
        run: |
          node -c core-spine/daemon.js
          echo "Hexagonal IPC Router syntax valid."
      - name: Validate Android Termux Provisioner
        run: |
          bash -n scripts/setup-android-termux.sh
          echo "Android Termux script syntax valid."
