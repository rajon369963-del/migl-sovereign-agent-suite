name: MIGL Sovereign Suite CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate daemon syntax
        run: npm run test:syntax
      - name: Exercise real daemon HTTP contract
        run: npm test
      - name: Validate Android Termux provisioner syntax
        run: bash -n scripts/setup-android-termux.sh
